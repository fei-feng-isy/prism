[build-system]
requires = ["setuptools >= 68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-memory"
version = "1.0"
description = "Prism — 中文优先的多模态记忆系统（HRR 结构化推理 + 语义嵌入）"
readme = "README.md"
requires-python = ">= 3.10"
license = { file = "LICENSE" }
authors = [{ name = "qunqi.ff" }]
keywords = ["memory", "hrr", "embedding", "rag", "chinese"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Intended Audience :: Developers",
]

dependencies = [
    "pyyaml >= 6.0",
    "numpy >= 1.24",
    "jieba >= 0.42",
]

[project.optional-dependencies]
semantic = [
    "sentence-transformers >= 2.7",
    "torch >= 2.0",
]
hnswlib = ["hnswlib >= 0.8"]
faiss = ["faiss-cpu >= 1.7"]
pgvector = ["psycopg[binary] >= 3.1", "pgvector >= 0.2"]
qdrant = ["qdrant-client >= 1.7"]
cloud = ["openai >= 1.0", "voyageai >= 0.2"]
mcp = ["mcp >= 1.0"]

dev = [
    "pytest >= 7.4",
    "pytest-cov >= 4.1",
    "pytest-benchmark >= 4.0",
    "pytest-xdist >= 3.5",
    "hypothesis >= 6.90",
    "freezegun >= 1.4",
    "ruff >= 0.4",
    "mypy >= 1.8",
]

[project.scripts]
prism = "prism.cli.__main__:main"

[project.urls]
Documentation = "https://github.com/fei-feng-isy/prism/tree/master/doc"
Source = "https://github.com/fei-feng-isy/prism"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prism = ["py.typed"]

# ─── ruff ───
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = [
    "E501",     # line length handled by formatter
    "RUF001",   # 中文标点在中文字符串中是预期的
    "RUF002",   # 中文标点在中文 docstring 中是预期的
    "RUF003",   # 中文标点在中文注释中是预期的
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]   # 允许 assert False

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ───
[tool.mypy]
python_version = "3.10"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_decorators = true
files = ["src/prism", "tests"]

[[tool.mypy.overrides]]
module = ["jieba.*", "sentence_transformers.*", "hnswlib.*", "faiss.*", "pgvector.*", "qdrant_client.*"]
ignore_missing_imports = true

# ─── pytest ───
[tool.pytest.ini_options]
addopts = """
    -ra --strict-markers
    --cov=src/prism --cov-report=term-missing --cov-report=html
    --cov-fail-under=80
"""
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "stress: 压力测试（带 benchmark）",
    "regression: 评估集回归",
    "slow: 慢测试（默认跳过）",
    "requires_model: 需要 sentence-transformers 模型",
    "requires_external: 需要外部服务（hnswlib/faiss/pgvector/qdrant）",
]

# ─── coverage ───
[tool.coverage.run]
branch = true
source = ["src/prism"]
omit = ["src/prism/cli/__main__.py", "tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "^\\s*\\.\\.\\.\\s*$",  # Protocol / abstract method 体内的 `...`，不可达
]
